esphome:
  name: dooya-test

api:
  encryption:
    key: !secret encryption_key
  reboot_timeout: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: VERBOSE
  logs:
    dooya_bidir: VERBOSE # raw RX frames
    cc1101: DEBUG
    spi: INFO
    component: INFO
    scheduler: INFO

external_components:
  - source:
      type: local
      path: components

spi:
  clk_pin: GPIO4
  miso_pin: GPIO5
  mosi_pin: GPIO6

cc1101:
  id: radio
  cs_pin: GPIO7
  gdo0_pin: GPIO2
  frequency: 433.925MHz
  modulation_type: GFSK
  symbol_rate: 40000
  fsk_deviation: 20kHz
  sync1: 0x2D
  sync0: 0xD4
  sync_mode: 30/32 # sync word sent twice (2D D4 2D D4)
  num_preamble: 7 # longest available (24 bytes); only affects TX
  packet_mode: true
  packet_length: 0 # variable length

dooya_bidir:
  id: dooya
  cc1101_id: radio
  on_pair:
    - homeassistant.event:
        event: esphome.dooya_bidir_paired
        data:
          address: !lambda 'return str_sprintf("0x%08" PRIX32, address);'
          pair_code: !lambda 'return str_sprintf("0x%02X", pair_code);'
          already_configured: !lambda 'return already_configured ? "true" : "false";'
  motors:
    - id: living_room
      name: Living Room
      address: 0x0CCB3466
    - id: bed_room_1
      name: Bed Room 1
      address: 0x47C95E5E
    - id: bed_room_2
      name: Bed Room 2
      address: 0x37B89A16
    - id: bed_room_3
      name: Bed Room 3
      address: 0xA36DAAC7

button:
  - platform: dooya_bidir
    name: Pair blind
  - platform: dooya_bidir
    motor_id: living_room
    action: favourite_1
    name: Living Room Favourite 1
  - platform: dooya_bidir
    motor_id: living_room
    action: favourite_2
    name: Living Room Favourite 2
  - platform: dooya_bidir
    motor_id: bed_room_1
    action: favourite_1
    name: Bed Room 1 Favourite 1
  - platform: dooya_bidir
    motor_id: bed_room_2
    action: favourite_1
    name: Bed Room 2 Favourite 1
  - platform: dooya_bidir
    motor_id: bed_room_3
    action: favourite_1
    name: Bed Room 3 Favourite 1
  # Also: favourite_3/4, save_favourite_1..4, delete_favourite_1..4
  - platform: dooya_bidir
    motor_id: living_room
    action: save_favourite_1
    name: Living Room Save Favourite 1
    entity_category: config
  - platform: dooya_bidir
    motor_id: living_room
    action: delete_favourite_1
    name: Living Room Delete Favourite 1
    entity_category: config
  - platform: dooya_bidir
    motor_id: living_room
    action: step_up
    name: Living Room Step Up
  - platform: dooya_bidir
    motor_id: living_room
    action: step_down
    name: Living Room Step Down
  - platform: dooya_bidir
    motor_id: living_room
    action: dump_registers
    name: Living Room Dump Registers
    entity_category: diagnostic
  - platform: dooya_bidir
    motor_id: living_room
    action: dump_registers
    first: 0x40
    last: 0x5F
    name: Living Room Dump Settings
    entity_category: diagnostic

select:
  - platform: dooya_bidir
    motor_id: living_room
    direction:
      name: Living Room Direction

sensor:
  - platform: dooya_bidir
    motor_id: living_room
    rssi:
      name: Living Room RSSI

text_sensor:
  - platform: dooya_bidir
    motor_id: living_room
    model:
      name: Living Room Model
    sensitivity:
      name: Living Room Obstacle Sensitivity

binary_sensor:
  - platform: dooya_bidir
    motor_id: living_room
    connected:
      name: Living Room Connected
    rewind:
      name: Living Room Rewind at Obstacle

switch:
  - platform: dooya_bidir
    motor_id: living_room
    repeater:
      name: Living Room Signal Repeater

cover:
  - platform: dooya_bidir
    motor_id: living_room
    name: Living Room Blind
  - platform: dooya_bidir
    motor_id: bed_room_1
    name: Bed Room 1 Blind
  - platform: dooya_bidir
    motor_id: bed_room_2
    name: Bed Room 2 Blind
  - platform: dooya_bidir
    motor_id: bed_room_3
    name: Bed Room 3 Blind
